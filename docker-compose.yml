# RideFlow data platform — local stack.
# Profiles keep the footprint small (target machine: 4 CPU / 8 GB RAM):
#   core  : Postgres (Airflow metadb), ClickHouse (DWH), SeaweedFS (S3 data lake)
#   (SeaweedFS instead of MinIO: MinIO images are no longer published on Docker Hub)
#   batch : Airflow (api-server, scheduler, dag-processor)
#   bi    : Superset over ClickHouse marts → http://localhost:8088
# Later stages add: cdc, stream (Kafka), bi (Superset), obs.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: rideflow/airflow:local
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Each Cosmos task spawns a dbt process (~250 MB) inside the scheduler (LocalExecutor):
    # 2 parallel tasks keep it within the scheduler's memory limit.
    AIRFLOW__CORE__PARALLELISM: 2
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 120
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: 180
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    PYTHONPATH: /opt/rideflow/ingestion
    CLICKHOUSE_HOST: clickhouse
    S3_ENDPOINT: http://seaweedfs:8333
    S3_BUCKET: lake
    SITE_DATA_DIR: /opt/rideflow/site_data
    DBT_PROJECT_DIR: /opt/rideflow/dbt/rideflow
    DBT_PROFILES_DIR: /opt/rideflow/dbt/rideflow
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ./ingestion:/opt/rideflow/ingestion
    - ./dbt:/opt/rideflow/dbt
    - ./site/public/data:/opt/rideflow/site_data
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
  profiles: [batch]

services:
  postgres:
    image: postgres:16.4
    profiles: [core, batch]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [core, batch, bi]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/low_memory.xml:/etc/clickhouse-server/config.d/low_memory.xml:ro
      - ./clickhouse/config/compression.xml:/etc/clickhouse-server/config.d/compression.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER}", "--password", "${CLICKHOUSE_PASSWORD}", "-q", "SELECT 1"]
      interval: 5s
      retries: 20
    mem_limit: 2g


  airflow-init:
    <<: *airflow-common
    # migrate metadb + build dbt manifest (Cosmos renders DAGs from it)
    command: ["bash", "-c", "airflow db migrate && airflow pools set clickhouse 1 'Heavy ClickHouse work, one at a time' && cd $$DBT_PROJECT_DIR && /opt/airflow/dbt_venv/bin/dbt parse --quiet"]
    restart: "no"

  airflow-api:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 20
    mem_limit: 768m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1536m

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    profiles: [core, batch]
    env_file: .env
    # Render S3 identities from env, then run master+volume+filer+s3 in one process
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|\$${S3_ACCESS_KEY}|$$S3_ACCESS_KEY|" -e "s|\$${S3_SECRET_KEY}|$$S3_SECRET_KEY|" /etc/seaweedfs/s3.json.tpl > /tmp/s3.json
        exec weed server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - lake-data:/data
      - ./seaweedfs/s3.json.tpl:/etc/seaweedfs/s3.json.tpl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 5s
      retries: 20
    mem_limit: 512m

  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    image: rideflow/superset:local
    profiles: [bi]
    env_file: .env
    environment:
      SERVER_WORKER_AMOUNT: 1
      SERVER_THREADS_AMOUNT: 8
    command: ["/app/docker/rideflow-bootstrap.sh"]
    ports:
      - "8088:8088"
    volumes:
      - superset-home:/app/superset_home
      - ./superset/dashboards:/app/rideflow/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      start_period: 90s
      retries: 20
    mem_limit: 1280m

volumes:
  superset-home:
  lake-data:
  pg-data:
  ch-data:
  airflow-logs:
