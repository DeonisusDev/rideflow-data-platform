name: rideflow
version: "0.1.0"
config-version: 2
profile: rideflow

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  rideflow:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  rideflow:
    +schema: staging
    taxi_zones:
      +tags: [taxi]
      +column_types:
        LocationID: UInt16
        Borough: String
        Zone: String
        service_zone: String
