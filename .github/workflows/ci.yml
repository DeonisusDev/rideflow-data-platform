name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check ingestion airflow/dags

  dbt-parse:
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_USER: ci
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r dbt/requirements.txt
      - run: dbt parse --project-dir dbt/rideflow --profiles-dir dbt/rideflow

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy-pages:
    # Data in site/public/data is produced by the local pipelines and committed;
    # CI only builds and ships the static site.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, dbt-parse, site-build]
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
